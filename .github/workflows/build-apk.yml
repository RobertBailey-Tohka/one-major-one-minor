name: Build Android Widget APK

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'build-android-apk.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Signed Android Widget APK
        run: python3 build-android-apk.py

      - name: Publish APK to Repository Root for Direct Download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add one-minor-one-major.apk
          if ! git diff --cached --quiet; then
            git commit -m "Auto-build Android Widget APK [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
